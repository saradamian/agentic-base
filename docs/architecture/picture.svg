<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>

  <text x="32" y="40" font-size="19" font-weight="600" fill="#1a1a1a">Where agentic-base sits</text>
  <text x="32" y="62" font-size="13" fill="#666">Bottom layer. Contracts and the record. No agent, no orchestration, no serving.</text>

  <!-- APPLICATIONS -->
  <rect x="32" y="88" width="620" height="92" rx="6" fill="#f6f6f6" stroke="#d0d0d0"/>
  <text x="46" y="110" font-size="12" font-weight="600" fill="#555">APPLICATIONS &#183; people's own work, each brings its own agent</text>
  <rect x="50" y="122" width="180" height="44" rx="4" fill="#ffffff" stroke="#bbb"/>
  <text x="140" y="142" font-size="13" text-anchor="middle" fill="#1a1a1a">agentic-env</text>
  <text x="140" y="158" font-size="11" text-anchor="middle" fill="#777">experiments, papers</text>
  <rect x="244" y="122" width="180" height="44" rx="4" fill="#ffffff" stroke="#bbb"/>
  <text x="334" y="142" font-size="13" text-anchor="middle" fill="#1a1a1a">pipeline triage</text>
  <text x="334" y="158" font-size="11" text-anchor="middle" fill="#777">a new SURF project</text>
  <rect x="438" y="122" width="180" height="44" rx="4" fill="#ffffff" stroke="#bbb"/>
  <text x="528" y="147" font-size="13" text-anchor="middle" fill="#1a1a1a">other SURF teams</text>

  <!-- CONTROL PLANE -->
  <rect x="32" y="200" width="620" height="80" rx="6" fill="#f6f6f6" stroke="#d0d0d0"/>
  <text x="46" y="222" font-size="12" font-weight="600" fill="#555">CONTROL PLANE &#183; who may run what, and where</text>
  <rect x="50" y="234" width="568" height="34" rx="4" fill="#ffffff" stroke="#bbb"/>
  <text x="334" y="256" font-size="13" text-anchor="middle" fill="#1a1a1a">AI4Science &#183; jobs, tenancy, datasets, orchestration</text>

  <!-- CAPABILITIES -->
  <rect x="32" y="300" width="620" height="96" rx="6" fill="#fdf6e3" stroke="#e8c86a"/>
  <text x="46" y="322" font-size="12" font-weight="600" fill="#8a6d1f">CAPABILITIES &#183; one per system, curated surface, published to agents</text>
  <rect x="50" y="336" width="108" height="44" rx="4" fill="#ffffff" stroke="#e8c86a"/>
  <text x="104" y="356" font-size="13" text-anchor="middle" fill="#1a1a1a">runs</text>
  <text x="104" y="371" font-size="10" text-anchor="middle" fill="#b07d1a">only new one</text>
  <rect x="170" y="336" width="108" height="44" rx="4" fill="#ffffff" stroke="#e8c86a"/>
  <text x="224" y="362" font-size="13" text-anchor="middle" fill="#1a1a1a">hpc</text>
  <rect x="290" y="336" width="108" height="44" rx="4" fill="#ffffff" stroke="#e8c86a"/>
  <text x="344" y="362" font-size="13" text-anchor="middle" fill="#1a1a1a">data</text>
  <rect x="410" y="336" width="108" height="44" rx="4" fill="#ffffff" stroke="#e8c86a"/>
  <text x="464" y="362" font-size="13" text-anchor="middle" fill="#1a1a1a">software</text>
  <rect x="530" y="336" width="88" height="44" rx="4" fill="#ffffff" stroke="#e8c86a"/>
  <text x="574" y="362" font-size="13" text-anchor="middle" fill="#1a1a1a">knowledge</text>

  <!-- BASE -->
  <rect x="32" y="416" width="620" height="108" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="46" y="438" font-size="12" font-weight="600" fill="#1a53b0">agentic-base &#183; THIS REPOSITORY</text>
  <rect x="50" y="452" width="130" height="28" rx="4" fill="#ffffff" stroke="#8ab0f0"/>
  <text x="115" y="471" font-size="12" text-anchor="middle" fill="#1a1a1a">tool contract</text>
  <rect x="192" y="452" width="140" height="28" rx="4" fill="#ffffff" stroke="#8ab0f0"/>
  <text x="262" y="471" font-size="12" text-anchor="middle" fill="#1a1a1a">span vocabulary</text>
  <rect x="344" y="452" width="140" height="28" rx="4" fill="#ffffff" stroke="#8ab0f0"/>
  <text x="414" y="471" font-size="12" text-anchor="middle" fill="#1a1a1a">recording seam</text>
  <rect x="496" y="452" width="122" height="28" rx="4" fill="#ffffff" stroke="#8ab0f0"/>
  <text x="557" y="471" font-size="12" text-anchor="middle" fill="#1a1a1a">primitives</text>
  <rect x="50" y="488" width="568" height="28" rx="4" fill="#ffffff" stroke="#8ab0f0"/>
  <text x="334" y="507" font-size="12" text-anchor="middle" fill="#1a1a1a">run record &#183; label provenance &#183; comparison validity &#183; epoch boundaries</text>

  <!-- EXISTING SYSTEMS -->
  <rect x="684" y="88" width="284" height="308" rx="6" fill="#f0f7f0" stroke="#9dc49d"/>
  <text x="698" y="110" font-size="12" font-weight="600" fill="#3d6b3d">ALREADY EXIST &#183; not ours to rebuild</text>
  <rect x="702" y="124" width="248" height="42" rx="4" fill="#ffffff" stroke="#9dc49d"/>
  <text x="826" y="143" font-size="13" text-anchor="middle" fill="#1a1a1a">Willma</text>
  <text x="826" y="158" font-size="11" text-anchor="middle" fill="#777">serves the models</text>
  <rect x="702" y="180" width="248" height="42" rx="4" fill="#ffffff" stroke="#9dc49d"/>
  <text x="826" y="199" font-size="13" text-anchor="middle" fill="#1a1a1a">Slurm clusters</text>
  <text x="826" y="214" font-size="11" text-anchor="middle" fill="#777">Snellius, LUMI, AI Factory</text>
  <rect x="702" y="236" width="248" height="36" rx="4" fill="#ffffff" stroke="#9dc49d"/>
  <text x="826" y="259" font-size="13" text-anchor="middle" fill="#1a1a1a">Confluence</text>
  <rect x="702" y="286" width="248" height="36" rx="4" fill="#ffffff" stroke="#9dc49d"/>
  <text x="826" y="309" font-size="13" text-anchor="middle" fill="#1a1a1a">EasyBuild</text>
  <text x="826" y="356" font-size="11" text-anchor="middle" fill="#3d6b3d">each is published as one capability</text>
  <text x="826" y="372" font-size="11" text-anchor="middle" fill="#3d6b3d">with a reviewed, read-only-by-default surface</text>

  <!-- arrows down the stack -->
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#999"/></marker></defs>
  <line x1="342" y1="180" x2="342" y2="198" stroke="#999" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="342" y1="280" x2="342" y2="298" stroke="#999" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="342" y1="396" x2="342" y2="414" stroke="#999" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="652" y1="348" x2="700" y2="300" stroke="#999" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="32" y="560" font-size="12" fill="#555">Nothing moves here from AI4Science. What moves is the part of agentic-env that is not experiment-specific,</text>
  <text x="32" y="578" font-size="12" fill="#555">so it can keep its experiments and stop also being everyone's library. About 3,300 lines.</text>
  <text x="32" y="604" font-size="12" fill="#b03030">Nothing moves until: the project exists on the server, the consumer records which version of this layer it ran</text>
  <text x="32" y="620" font-size="12" fill="#b03030">against, and relocation lands in a separate commit from behaviour change.</text>
</svg>
