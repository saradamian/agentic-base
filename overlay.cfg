# The deployment-overlay contract. Read by scripts/overlay.py and by tests/test_overlay_contract.py.
#
# A deployment overlay is a private repository holding everything that describes WHERE this
# software runs: pipeline definition, environment manifests, registry, catalogue entry. The
# deployable repository is this one with the overlay laid on top, and it stays current by
# merging this repository's main. That merge is conflict-free for as long as one rule holds:
#
#     the overlay may only ADD files. Every path listed here must not exist upstream.
#
# So this file declares the paths an overlay owns, and the guard upstream refuses a change that
# creates one of them here, while the guard downstream refuses an upstream-owned file that has
# been edited on the deployment side or that carries a site identifier.
[overlay]
upstream = https://github.com/saradamian/agentic-base
paths =
    .overlay/
    .gitlab-ci.yml
    .gitlab/
    manifests/
    CODEOWNERS
    catalog-info.yaml
    renovate.json
    OVERLAY.md
    docs/sdp/
    tests/test_gitlab_pipeline.py
