# OpenSSF Scorecard: the standard external audit of a repository's own security posture, on
# every push to main and weekly. Results go to code scanning, where they show as alerts, and to
# the public Scorecard API, which is what the badge reads.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: results.sarif
