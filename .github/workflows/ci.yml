# The gate this repository declares, run on both ends of the supported range. The floor is not
# decoration: the portable-surface guards mean nothing unless something executes them there.
#
# Actions are pinned to commit hashes, not tags. A tag can be moved; a hash cannot.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv lock --check
      - run: uv sync --python ${{ matrix.python }} --group dev --extra service --extra provenance
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/ruff format --check src tests
      - run: .venv/bin/mypy src tests
      - run: .venv/bin/pytest tests -q --cov=src --cov-report=term

  # The database a deployment runs is PostgreSQL, and the suite's per-test engine is SQLite. The
  # two differ where it matters most: a uniqueness conflict surfaces at the flush on PostgreSQL
  # and at the commit on SQLite, and only PostgreSQL lets eight writers run at once. The
  # lost-update and the 500-instead-of-409 defects were PostgreSQL-only in their worst form and
  # a SQLite suite could not have found them, so the same tests run here against PostgreSQL.
  check-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --python 3.14 --group dev --extra service --extra provenance
      - run: .venv/bin/pytest tests -q
        env:
          AGENTIC_BASE_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/ci

  # The image is what a deployment runs, and a gate over the source says nothing about it: built
  # without the service extra, it started without structlog and exited. So it is built and started
  # here on every change. It is not published or scanned here; the platform pipeline does both.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the tags, so the image reads its version from git as a release does
      - run: docker build -t agentic-base:ci .
      - name: the image carries the service and its commands, and no development tools
        run: |
          docker run --rm --entrypoint /app/.venv/bin/python agentic-base:ci -c '
          import importlib.metadata as m, importlib.util as u, shutil
          missing = [d for d in ("fastapi", "sqlmodel", "structlog", "alembic", "prov") if u.find_spec(d) is None]
          present = [d for d in ("pytest", "ruff", "mypy") if u.find_spec(d) is not None]
          assert not missing, f"service dependencies missing: {missing}"
          assert not present, f"development tools in the image: {present}"
          version = m.version("surf-agentic-base")
          assert version != "0.0.0", "the image fell back to 0.0.0: it could not read its version"
          print("surf-agentic-base", version)
          '
      - name: the migration command builds a database
        run: >
          docker run --rm --read-only --tmpfs /tmp -e DATABASE_URL=sqlite:////tmp/ci.db
          --entrypoint /app/.venv/bin/agentic-base-migrate agentic-base:ci
      - name: the service starts and answers
        run: |
          docker run -d --name svc --read-only --tmpfs /tmp -p 8080:8080 \
            -e DATABASE_URL=sqlite:////tmp/svc.db -e METRICS_PORT=0 \
            -e API_TOKENS='{"ci-token-000000000001": ["ci"]}' agentic-base:ci
          for _ in $(seq 1 30); do curl -sf localhost:8080/health/liveness && break; sleep 1; done
          docker logs svc
          curl -sf localhost:8080/health/liveness
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8080/runs/export?tenant=ci')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-token-000000000001' 'localhost:8080/runs/export?tenant=ci')" = 200
