[project]
name = "agentic-platform"
authors = [{ name = "SURF" }]
description = "Agentic platform layer: run provenance, comparison validity, and HPC execution for agentic workloads."
requires-python = ">=3.14"
dynamic = ["version", "readme"]

dependencies = [
  "asgi-correlation-id==5.0.1",
  "fastapi[standard]==0.141.1",
  "prometheus-fastapi-instrumentator==8.1.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn==0.52.4",
  "structlog==26.1.0",
  "sqlmodel==0.0.27",
  "alembic==1.17.2",
  "psycopg[binary]==3.2.12",
  "pyyaml==6.0.4",

]

[dependency-groups]
dev = [
  "httpx2",
  "coverage==7.16.0",
  "mypy==2.3.1",
  "mypy-extensions==1.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-env==1.7.1",
  "ruff==0.16.6",
  "mkdocs-techdocs-core==1.7.1",

]

[tool.setuptools.dynamic]
readme = { file = ["README.md"] }

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.ruff]
src = ["src"]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  ".venv",
  ".vscode",
  "__pypackages__",
  "build",
  "dist",
  "venv",
]

line-length = 88
indent-width = 4

# Assume Python version
target-version = "py314"

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = [
  "E501",   # Don't complain about line length, the formatter should handle this.
  "COM812", # This does not play wel with formatter
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "ANN",    # Don't force type annotations
  "S101",   # We need assert in test
  "PT023",  # don't force braces on fixtures
  "PT019",  # Don't force usefixtures
  "D",      # Don't need docstrings in test
  "ARG001", # Don't warn about fixtures that are not actually used in the test body
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"


[tool.mypy]
local_partial_types = true

show_error_codes = true

ignore_missing_imports = true
follow_imports = "skip"

plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest]
pythonpath = ["src", "."]
filterwarnings = [
  "error", # Make warnings errors
]
env = [
  "METRICS_PORT=0", # Don't start metrics server during tests
]
strict = true # enable strictness options https://docs.pytest.org/en/stable/explanation/goodpractices.html#using-pytest-s-strict-mode

[tool.coverage.run]
branch = true
source = ["src/"]
omit = ["tests/*"]

[tool.coverage.report]
# Ratcheted. tests/test_process.py asserts this is at least MINIMUM_COVERAGE, so lowering the
# flag alone does not lower the gate.
fail_under = 88
