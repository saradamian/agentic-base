[project]
name = "agentic-base"
authors = [{ name = "SURF" }]
description = "Agentic base layer: run provenance, comparison validity, and shared safety primitives."
requires-python = ">=3.10"
license = "EUPL-1.2"
license-files = ["LICENSE"]
dynamic = ["version", "readme"]
keywords = ["agents", "provenance", "reproducibility", "evaluation", "mcp", "opentelemetry", "hpc", "slurm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

# The library half. Anything a consumer imports must be satisfiable by this list alone.
#
# The floor is 3.10 and the list is short because of who imports this. `agentic-env` declares
# `requires-python = ">=3.10"` and its benchmark cells run inside task containers on compute
# nodes, so a base layer that needs 3.14, a web framework and a Postgres driver cannot be
# imported there at all. That is not a packaging preference, it is the difference between this
# layer being adoptable and being a second copy of the code it was meant to replace.
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Emitting the provenance standards through their own libraries; see docs/architecture/reuse-ledger.md.
provenance = [
  "prov>=3.1,<4",
  "openlineage-python>=1.53,<2",
  "rocrate>=0.15,<1",
]
# The service half: the API, its storage and its telemetry wiring. Deployed here, never imported
# by a consumer. Kept pinned because this half is a running service; the library half is a
# dependency of other people's software and pins there would be their problem, not ours.
service = [
  "asgi-correlation-id==5.0.1",
  # The protocol belongs to the SDK; docs/architecture/reuse-ledger.md, mcp/server.py row.
  "mcp>=2.2,<3",
  "fastapi[standard]==0.141.1",
  "prometheus-fastapi-instrumentator==8.1.0",
  "uvicorn==0.52.4",
  # Tracing: the vocabulary in observability/conventions.py is worthless if no span is opened.
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "structlog==26.1.0",
  "sqlmodel==0.0.27",
  "alembic==1.17.2",
  "psycopg[binary]==3.2.12",
]

[project.urls]
Homepage = "https://github.com/saradamian/agentic-base"
Repository = "https://github.com/saradamian/agentic-base"
Issues = "https://github.com/saradamian/agentic-base/issues"
Changelog = "https://github.com/saradamian/agentic-base/releases"

[dependency-groups]
dev = [
  "httpx2",
  "coverage==7.16.0",
  "mypy==2.3.1",
  "mypy-extensions==1.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-env==1.7.1",
  "ruff==0.16.6",
  "mkdocs-techdocs-core==1.7.1",
  # The suite runs on the consumer floor too, so the 3.10 leg needs a TOML reader.
  'tomli>=2.4; python_version < "3.11"',

]

# The bundled cluster profiles are runtime data, not documentation: `load_profile` reads them.
# A wheel ships no non-Python file unless it is named, and the failure is silent until somebody
# installs the distribution and calls the function.
[tool.setuptools.package-data]
"agentic_base.hpc" = ["profiles/*.yaml"]

[tool.setuptools.dynamic]
readme = { file = ["README.md"], content-type = "text/markdown" }

# The version is the git tag. `v0.1.0` builds 0.1.0; an untagged commit builds a dev version
# after the last tag; a source archive with no git history builds the fallback, which is
# deliberately not a real version so it can never be mistaken for a release.
[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.ruff]
src = ["src"]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  ".venv",
  ".vscode",
  "__pypackages__",
  "build",
  "dist",
  "venv",
]

line-length = 88
indent-width = 4

# Assume Python version
target-version = "py310"

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = [
  "E501",   # Don't complain about line length, the formatter should handle this.
  "COM812", # This does not play wel with formatter
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
# `scripts` is first-party too; without this the sorter files it with third-party imports.
known-first-party = ["agentic_base", "scripts"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in a parameter default is FastAPI's declared way of asking for a dependency,
# not the mutable-default bug B008 exists to catch. Scoped to the routers so the rule keeps
# working everywhere it means what it says.
"src/agentic_base/routers/*" = ["B008"]
"tests/*" = [
  "ANN",    # Don't force type annotations
  "S101",   # We need assert in test
  "PT023",  # don't force braces on fixtures
  "PT019",  # Don't force usefixtures
  "D",      # Don't need docstrings in test
  "ARG001", # Don't warn about fixtures that are not actually used in the test body
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"


[tool.mypy]
local_partial_types = true

show_error_codes = true

ignore_missing_imports = true
follow_imports = "skip"

plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest]
pythonpath = ["src", "."]
filterwarnings = [
  "error", # Make warnings errors
  # starlette 1.6 reaches anyio's deprecated `anyio.abc.BlockingPortal` alias at import, and
  # anyio 4.15 warns. Scoped to that one message so every other warning still fails the suite.
  # Remove when the pinned fastapi brings a starlette that imports `anyio.from_thread`.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
env = [
  "METRICS_PORT=0", # Don't start metrics server during tests
]
strict = true # enable strictness options https://docs.pytest.org/en/stable/explanation/goodpractices.html#using-pytest-s-strict-mode

[tool.coverage.run]
branch = true
source = ["src/"]
omit = ["tests/*"]

[tool.coverage.report]
# Ratcheted. tests/test_process.py asserts this is at least MINIMUM_COVERAGE, so lowering the
# flag alone does not lower the gate.
fail_under = 88
