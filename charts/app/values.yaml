replicaCount: 1

image:
  repository: the internal registry/templates-agentic-platform/agentic-platform
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets:
  - name: registry-credentials

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  # False: this workload never calls the Kubernetes API, and a mounted token is the first thing
  # an agent that has been talked into something reaches for.
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # Writable paths are declared, not inherited. /tmp is mounted as an emptyDir below.
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsGroup: 1000
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # Memory request equals its limit so the pod is Guaranteed and cannot be evicted under node
  # pressure caused by a neighbour. The ephemeral-storage limit is the cluster's replacement for
  # the disk guard we had to write on a shared workstation.
  limits:
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 2Gi
  requests:
    cpu: 100m
    memory: 512Mi
    ephemeral-storage: 512Mi
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /health/liveness
    port: http
  initialDelaySeconds: 5  # make sure to adjust this setting depending on how long it takes for your app to start
readinessProbe:
  httpGet:
    path: /health/readiness
    port: http

monitoring:
  service:
    name: http-metrics
    port: 9000

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  # Utilisation is deliberately absent, and this is a measured position rather than a preference.
  # On an inference path utilisation is not a weak signal, it is an inverted one: past a critical
  # concurrency the cache is oversubscribed, the engine evicts in-flight requests and recomputes
  # their prefill, and the accelerators stay pinned at full while completing less. Measured on one
  # pool: concurrency 18 gave 16,724 tok/s with no preemptions; concurrency 39 gave 7,024 tok/s
  # with preemptions accumulating and per-call latency rising from about 11 s to 64-82 s. An
  # autoscaler reading utilisation sees the degraded state as healthy and scales the wrong way.
  # Honest limit: two operating points, not a tuning study. The peak was never located.
  #
  # Scale on queued work instead, and alert on the preemption counter. The metric name is whatever
  # the cluster's adapter exposes; this is the shape, not the identifier.
  metrics:
    - type: External
      external:
        metric:
          name: inference_requests_waiting
        target:
          type: AverageValue
          averageValue: "4"

lifecycle:
  # An agent run is long. Kubernetes sends SIGTERM, waits this long, then SIGKILLs, so a grace
  # period shorter than the longest in-flight request cuts trajectories in half on every rolling
  # update, scale-down and node drain. This is the same invariant that governed serve drains on
  # the batch scheduler: any cleanup whose timer is shorter than the work it must outlive destroys
  # results silently, and the loss is usually recorded as a failure of the work.
  #
  # The grace period is DERIVED in the template, never written as a literal. A literal drifts the
  # moment the timeout changes, and that exact drift has cost real work three times: a drain lead
  # shorter than the cell timeout, a reaper on a fifteen-minute threshold against fifty-minute
  # cells which lost 229 of them, and a stale literal left from an earlier timeout that killed
  # roughly a third of all cells for sixty-six hours with nothing in any log.
  #
  # Set longestRequestSeconds from the consumer's own request timeout. Everything else follows.
  longestRequestSeconds: 1800
  # Pod deletion and endpoint removal race. Sleeping first lets the removal propagate, so the pod
  # stops receiving new work before it is asked to stop.
  preStopSleepSeconds: 15
  # Headroom on top of the request and the sleep.
  marginSeconds: 45

networkPolicy:
  # Default-deny egress. This is where generated code finally meets a real boundary: the
  # structural filter in app.code_policy is a pre-filter and its own documentation says it is not
  # an isolation boundary.
  #
  # Check with the platform team before relying on this. A namespace-level policy may already
  # enforce it, in which case this declaration is redundant and still worth keeping, so the chart
  # describes its own requirements instead of being correct by accident.
  enabled: true
  # Egress the service genuinely needs. Everything else is refused.
  allowDNS: true
  allowedPorts:
    - protocol: TCP
      port: 5432   # PostgreSQL, the tenant database
    - protocol: TCP
      port: 9000   # object storage
    - protocol: TCP
      port: 443    # model endpoint and platform services

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agentic-platform
          topologyKey: "kubernetes.io/hostname"

podDisruptionBudget:
  minAvailable: 50%  # Specify the minimum number of pods that must be available at any given time. Use this for applications for which availability is important.
  # maxUnavailable: 80%  # Specify the maximum number of pods that can be unavailable during an update. Use this for applications where availability is less critical.

config:
  logLevel: "info"

# Will be set during preview deploys
namePrefix: ""
