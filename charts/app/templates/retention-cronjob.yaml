{{- if .Values.retention.enabled }}
# Erases transcripts older than each tenant's policy and writes each erasure into the audit log.
# One run at a time: a sweep that overlapped another would contend for the same tenants' logs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "app.fullname" . }}-retention
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.retention.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "app.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: retention
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/app/.venv/bin/agentic-base-retention", "sweep", "--apply"]
              {{- with .Values.envFromSecret }}
              envFrom:
                - secretRef:
                    name: {{ . }}
              {{- end }}
              env:
                - name: LOG_JSON_FORMAT
                  value: "true"
                - name: METRICS_PORT
                  value: "0"
                {{- with .Values.retention.policies }}
                - name: RETENTION_POLICIES
                  value: {{ . | quote }}
                {{- end }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
