apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.monitoring.service.port }}
      targetPort: {{ .Values.monitoring.service.name }}
      protocol: TCP
      name: {{ .Values.monitoring.service.name }}
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: block-traffic-service
spec:
  selector:
    app: non-existent
  ports:
    - port: 9999
      targetPort: 8080
