site_name: surf-agentic-base
site_description: "Platform layer for agentic workloads: run provenance, comparison validity, and HPC execution."

repo_url: !ENV [DOCS_REPO_URL, "https://github.com/saradamian/agentic-base"]
edit_uri: -/edit/main/docs/

nav:
  - Home: index.md
  - Readme: include-readme.md
  - Decisions: decisions.md
  - Architecture:
    - The picture: architecture/picture.md
    - Layering: architecture/layering.md
    - Boundaries: architecture/boundaries.md
    - Move plan: architecture/move-plan.md
    - Reuse ledger: architecture/reuse-ledger.md
    - From agentic-env: architecture/from-agentic-env.md
    - Going live on SDP: architecture/go-live-on-sdp.md
    - Compliance evidence: architecture/compliance.md
    - Operational traps: architecture/operational-traps.md
    - What Kubernetes changes: architecture/kubernetes.md
    - Repository process: architecture/process.md
plugins:
  - techdocs-core
theme:
  name: material
  font: false

markdown_extensions:
  - pymdownx.snippets # Needed for the readme include
