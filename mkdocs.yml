site_name: surf-agentic-base
site_description: "The record and referee for agent runs, the security primitives an agent needs on a shared platform, and the engineering standard that keeps both honest."

repo_url: !ENV [DOCS_REPO_URL, "https://github.com/saradamian/agentic-base"]
edit_uri: -/edit/main/docs/

nav:
  - Home: index.md
  - Readme: include-readme.md
  - Concepts: concepts.md
  - Running the service: service.md
  - Reference:
    - Decisions: decisions.md
    - Observability: OBSERVABILITY.md
    - Compliance evidence: architecture/compliance.md
    - Redaction: architecture/redaction.md
    - Incident response: architecture/incident-response.md
    - Reuse ledger: architecture/reuse-ledger.md
    - The engineering standard: ENGINEERING.md
    - Repository process: architecture/process.md
    - Going live on SDP: architecture/go-live-on-sdp.md
    - The deployment overlay: architecture/deployment-overlay.md
plugins:
  - techdocs-core
theme:
  name: material
  font: false

markdown_extensions:
  - pymdownx.snippets # Needed for the readme include
